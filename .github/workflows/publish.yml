name: Publish Package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Fish-under-sea/dsh-agent-teams-fish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.value }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Read package identity
        id: version
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          console.log(`value=${pkg.version}`)
          console.log(`package_name=${pkg.name}`)
          console.log(`prerelease=${pkg.version.includes('-')}`)
          console.log(`dist_tag=${pkg.publishConfig?.tag ?? 'latest'}`)
          JS
      - name: Match the requested release identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
          else
            test "$RELEASE_VERSION" = "$PACKAGE_VERSION"
          fi
      - name: Detect an already published version
        id: existing
        env:
          PACKAGE_NAME: ${{ steps.version.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version is already on npm; skipping npm publication"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prevent moving latest backwards
        if: steps.version.outputs.dist_tag == 'latest' && steps.existing.outputs.already != 'true'
        env:
          PACKAGE_NAME: ${{ steps.version.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          CURRENT_LATEST="$(npm view "${PACKAGE_NAME}" dist-tags.latest 2>/dev/null || echo 0.0.0)"
          export CURRENT_LATEST
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          const current = /^(\d+)\.(\d+)\.(\d+)/.exec(process.env.CURRENT_LATEST)
          const candidate = /^(\d+)\.(\d+)\.(\d+)$/.exec(process.env.PACKAGE_VERSION)
          assert.ok(current && candidate, 'Cannot compare release versions')
          for (let index = 1; index <= 3; index++) {
            if (Number(candidate[index]) > Number(current[index])) break
            assert.ok(Number(candidate[index]) >= Number(current[index]), 'Refusing to move latest backwards')
          }
          JS
      - name: Publish committed artifacts without build or test hooks
        if: steps.existing.outputs.already != 'true'
        env:
          NPM_DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/candidate"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/candidate"
          npm publish "$RUNNER_TEMP"/candidate/*.tgz --ignore-scripts --access public --tag "$NPM_DIST_TAG"

  release:
    if: github.event_name == 'push'
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.publish.outputs.version }}
          name: AgentTeams v${{ needs.publish.outputs.version }}
          body_path: release-notes/v${{ needs.publish.outputs.version }}.md
          draft: false
          prerelease: ${{ needs.publish.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.publish.outputs.prerelease == 'true' && 'false' || 'true' }}
